name: App validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  apple-validation:
    name: Apple validation
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build app and extensions and run the complete XCTest suite
        env:
          ARCHERMES_VALIDATION_DIR: ${{ runner.temp }}/archermes-validation
        run: scripts/validate
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-validation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/archermes-validation/Tests.xcresult
            ${{ runner.temp }}/archermes-validation/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
